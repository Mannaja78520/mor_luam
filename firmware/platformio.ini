; mor_luam firmware (ESP32, micro-ROS over Wi-Fi, web app, OTA).
;
;   pio run -e morluam                 build
;   pio run -e morluam -t upload       flash over USB (/dev/ttyUSB0 in Docker)
;   pio run -e morluam_ota -t upload   flash over Wi-Fi (espota, needs the board's OTA password)
;
; On Windows use the helper instead:  docker\mor_luam.bat help
; The source map is in ../CLAUDE.md.

[env]
framework = arduino
platform = espressif32@^6.5.0
board = nodemcu-32s
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv      ; two 1.9 MB app slots: what OTA needs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:web/embed.py               ; packs web/ (the page) into src/web/WebPage.h
board_microros_distro = ${sysenv.ROS_DISTRO}
board_microros_transport = wifi
; 16 unacknowledged messages in flight instead of 4: over the PC hotspot (~40 ms round
; trip) 4 capped all ROS feedback at ~50 messages/s. Changing this file needs a
; micro-ROS rebuild: pio run -e morluam -t clean_microros (or docker\mor_luam.bat fw-clean-ros)
board_microros_user_meta = microros.meta
lib_deps =
	https://github.com/micro-ROS/micro_ros_platformio
	madhephaestus/ESP32Servo@^1.1.2
	madhephaestus/ESP32Encoder@^0.11.7
	Wire
	SPI
	adafruit/Adafruit Unified Sensor@^1.1.4
	adafruit/Adafruit BusIO@^1.16.1
	adafruit/Adafruit BNO08x@^1.2.5
	adafruit/Adafruit AS5600 Library@^1.0.0
	esphome/AsyncTCP-esphome@^2.1.4
	esphome/ESPAsyncWebServer-esphome@^3.2.2
	bblanchon/ArduinoJson@^7.0.4
build_flags =
	-I config
	-I src
	-D USE_ESP32_CONFIG
	-D MICROROS_TRANSPORT_WIFI

[env:morluam]
upload_protocol = esptool
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

[env:morluam_ota]
upload_protocol = espota
upload_port = mor-luam.local
upload_flags =
	--auth=${sysenv.MORLUAM_OTA_PASS}
